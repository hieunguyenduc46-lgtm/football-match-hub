# Render Blueprint cho backend FastAPI.
# Trên Render: New + -> Blueprint -> chọn repo này. Render tự đọc file này.
services:
  - type: web
    name: football-match-hub-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_MOCK
        value: "false"           # dùng API thật (đã có gói Pro). Thiếu key -> config.py tự fallback mock.
      - key: API_FOOTBALL_KEY
        sync: false              # tự nhập trong dashboard Render (bí mật)
      - key: API_FOOTBALL_VIA
        value: "direct"
      - key: SEASON
        value: "0"               # 0 = TỰ SUY mùa theo ngày (khỏi sửa mỗi năm). Đặt năm cụ thể để ghim.
      - key: FRONTEND_ORIGIN
        sync: false              # dán URL frontend đã deploy, vd https://...vercel.app
