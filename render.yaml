# Render Blueprint cho backend FastAPI.
# On Render: New + -> Blueprint -> pick this repo. Render reads this file automatically.
services:
  - type: web
    name: football-match-hub-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_MOCK
        value: "false"           # use the real API (Pro plan). Missing key -> config.py falls back to mock automatically.
      - key: API_FOOTBALL_KEY
        sync: false              # entered manually in the Render dashboard (secret)
      - key: API_FOOTBALL_VIA
        value: "direct"
      - key: SEASON
        value: "0"               # 0 = INFER the season from the date (no yearly edits). Set a specific year to pin it.
      - key: FRONTEND_ORIGIN
        sync: false              # paste the deployed frontend URL, e.g. https://...vercel.app
