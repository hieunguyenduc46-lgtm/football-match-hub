server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS. Resolving at request time (via the variable below) lets nginx
    # start even if the backend container is not up yet.
    resolver 127.0.0.11 valid=10s;

    # API calls are forwarded to the backend container (service name "backend" in docker compose).
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Single-page app: unknown paths fall back to index.html so Vue Router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
