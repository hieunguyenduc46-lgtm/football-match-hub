groups:
  - name: football-match-hub
    rules:
      # The backend stopped answering /metrics (container crashed, stopped or unreachable).
      - alert: BackendDown
        expr: up{job="fmh-backend"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Backend ({{ $labels.environment }}) is DOWN"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for 30 seconds."

      # More than 5% of requests fail with a 5xx error.
      - alert: HighErrorRate
        expr: |
          sum by (environment) (rate(http_requests_total{status=~"5.."}[2m]))
            / clamp_min(sum by (environment) (rate(http_requests_total[2m])), 0.001) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate ({{ $labels.environment }})"
          description: "{{ $value | humanizePercentage }} of requests are failing."

      # 95% of requests should finish in under 2 seconds.
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le, environment) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow responses ({{ $labels.environment }})"
          description: "p95 latency is {{ $value | humanizeDuration }}."

      # The external data provider (API-Football) keeps failing: quota, outage or invalid key.
      - alert: UpstreamApiErrors
        expr: sum by (environment) (increase(upstream_api_requests_total{outcome="error"}[5m])) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "API-Football errors ({{ $labels.environment }})"
          description: "{{ $value | printf \"%.0f\" }} failed upstream calls in the last 5 minutes."
