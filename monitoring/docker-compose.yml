# Monitoring stack (infrastructure as code), started by the Jenkins "Monitoring" stage:
#   Prometheus  :9090  scrapes /metrics from the staging and production backends, evaluates alert rules
#   Alertmanager:9093  groups alerts and sends notifications
#   alert-receiver     receives Alertmanager webhooks and logs them (stands in for Slack / email / PagerDuty)
#   Grafana     :3000  dashboard (anonymous read-only access for the demo)

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle          # lets the pipeline reload the config without a restart
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    ports:
      - "127.0.0.1:9093:9093"

  alert-receiver:
    image: python:3.13-slim
    restart: unless-stopped
    command: ["python", "-u", "/app/receiver.py"]
    volumes:
      - ./alert-receiver:/app:ro

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/football-match-hub.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

networks:
  default:
    name: fmh-monitoring
    external: true

volumes:
  prometheus-data:
  grafana-data:
