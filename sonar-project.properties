# SonarCloud configuration (read by sonar-scanner in the Jenkins "Code Quality" stage).
sonar.organization=hieunguyenduc46-lgtm
sonar.projectKey=hieunguyenduc46-lgtm_football-match-hub
sonar.projectName=Football Match Hub
sonar.host.url=https://sonarcloud.io

# What to analyse: application code vs test code.
sonar.sources=backend,frontend/src
sonar.tests=backend/tests,frontend/tests
# mock_data.py is sample data (not logic), so it is excluded from analysis.
sonar.exclusions=backend/tests/**,backend/mock_data.py,**/.venv/**,**/node_modules/**,**/dist/**
sonar.python.version=3.13

# Translation dictionaries repeat the same key structure for every language by design,
# so they are excluded from duplication detection (they contain data, not logic).
sonar.cpd.exclusions=frontend/src/i18n.js,frontend/src/utils/*Names.js
# Coverage is measured on code with unit tests (backend, utils, i18n, stores).
# Vue view/component templates are verified by the Deploy/Release smoke tests, not unit tests.
sonar.coverage.exclusions=frontend/src/views/**,frontend/src/components/**,frontend/src/App.vue,frontend/src/main.js,frontend/src/router/**

# Coverage and test reports produced by the Test stage.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/reports/junit.xml
sonar.python.xunit.skipDetails=true
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Wait for the Quality Gate result and fail the build if the gate fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
